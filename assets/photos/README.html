<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Placeholder — Akram's Portfolio</title>
  <style>
    body { background: #0a0a1a; color: #fff; font-family: system-ui; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1rem; text-align: center; }
    .box { border: 2px dashed #7b2dff; border-radius: 16px; padding: 3rem 4rem; }
    h2 { background: linear-gradient(90deg, #00f5d4, #7b2dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hint { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
    code { background: rgba(255,255,255,0.08); padding: 0.2em 0.5em; border-radius: 4px; color: #00f5d4; }
    a { color: #ff2d95; }
  </style>
</head>
<body>
  <div class="box">
    <h2>📷 Photo Slot Ready</h2>
    <p>Drop your portrait photo here:</p>
    <code>assets/photos/portrait.jpg</code>
    <p class="hint">Recommended: square, at least 500×500px<br>JPG or PNG format</p>
    <p class="hint">Once placed, the hero section will show your photo automatically</p>
  </div>
</body>
</html>
